[project]
name = "autometion"
version = "0.1.0"
description = "Automation utilities for the autometion repository"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Autometion CI", email = "ci@example.com" },
]
keywords = ["automation", "ci", "github-actions"]

[project.urls]
"Source" = "https://github.com/your-org/autometion"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
